name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      GITHUB_CLIENT_ID: ci
      GITHUB_CLIENT_SECRET: ci
      GITHUB_REDIRECT_URI: http://localhost:8000/auth/callback
      GITHUB_WEBHOOK_SECRET: ci-webhook-secret
      SESSION_SECRET: ci-session-secret
      GEMINI_API_KEY: ci
      GITHUB_APP_ID: "1"
      GITHUB_APP_SLUG: revue-ci
      GITHUB_APP_PRIVATE_KEY: Y2k=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
